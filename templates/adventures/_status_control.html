{% if user.is_staff or is_verified_member and user == adventure.owner %}
<form
    method="post"
    action="{% if adventure.status == 'completed' %}{% url 'mark_adventure_in_progress' adventure.slug %}{% else %}{% url 'mark_adventure_done' adventure.slug %}{% endif %}"
    class="adventure-status-form"
    data-adventure-status-form
>
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button
        type="submit"
        class="adventure-status adventure-status-control adventure-status-{{ adventure.display_status_key }}"
        data-adventure-status-control
        aria-label="Toggle Adventure status"
    >{{ adventure.display_status_label }}</button>
</form>
{% else %}
<span class="adventure-status adventure-status-{{ adventure.display_status_key }}">{{ adventure.display_status_label }}</span>
{% endif %}
