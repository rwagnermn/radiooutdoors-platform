<div class="password-requirements" data-password-requirements data-endpoint="{% url 'password_requirement_status' %}"{% if password_identity %} data-username="{{ password_identity.username }}" data-email="{{ password_identity.email }}" data-first-name="{{ password_identity.first_name }}" data-last-name="{{ password_identity.last_name }}"{% elif invitation %} data-email="{{ invitation.email }}" data-first-name="{{ invitation.name }}"{% endif %}>
    <p class="password-requirements-heading">Your password must:</p>
    <ul aria-live="polite" aria-label="Password requirements">
        <li data-requirement="minimum_length" data-satisfied="false"><span class="password-requirement-state">Still needed:</span> Be at least 8 characters long</li>
        <li data-requirement="not_similar" data-satisfied="false"><span class="password-requirement-state">Still needed:</span> Not be too similar to your callsign, name, or email address</li>
        <li data-requirement="not_common" data-satisfied="false"><span class="password-requirement-state">Still needed:</span> Not be a commonly used password</li>
        <li data-requirement="not_numeric" data-satisfied="false"><span class="password-requirement-state">Still needed:</span> Not be entirely numbers</li>
    </ul>
</div>
